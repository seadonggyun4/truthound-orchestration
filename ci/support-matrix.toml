[python]
min = "3.11"
primary = "3.12"
canary = "3.13"

[truthound]
range = ">=3.0,<4.0"
primary = "3.0.1"

[platforms.airflow]
required = true
extra = "airflow"
min = "3.3.2"
primary = "3.3.2"

[platforms.airflow.ci.min]
python = "3.11"
constraints = ["cryptography>=46.0.5", "certifi>=2026.10.19", "dnspython>=2.9.0", "opentelemetry-api>=1.45.1", "pyjwt>=2.15.0", "urllib3>=2.8.0"]
constraint_urls = []

[platforms.airflow.ci.primary]
python = "3.12"
constraints = ["cryptography>=46.0.5", "certifi>=2026.10.19", "dnspython>=2.9.0", "opentelemetry-api>=1.45.1", "pyjwt>=2.15.0", "urllib3>=2.8.0"]
constraint_urls = []

[platforms.prefect]
required = true
extra = "prefect"
min = "3.9.0"
primary = "3.9.0"

[platforms.prefect.ci.min]
python = "3.11"
constraints = []
constraint_urls = []

[platforms.prefect.ci.primary]
python = "3.12"
constraints = []
constraint_urls = []

[platforms.dagster]
required = true
extra = "dagster"
min = "1.13.1"
primary = "1.13.27"

[platforms.dagster.ci.min]
python = "3.11"
constraints = []
constraint_urls = []

[platforms.dagster.ci.primary]
python = "3.12"
constraints = []
constraint_urls = []

[platforms.mage]
required = true
extra = "mage"
host_version = "0.9.80"
security_supported = false
runtime_expectation = "Functional verification only: Mage 0.9.80 pins vulnerable dependencies; no security-supported host release. Core 3.3 requires a separate interpreter."

[platforms.kestra]
required = true
extra = "kestra"
min = "1.3.0"
primary = "2.0.0"
server_min = "2.0.8"
server_sha256 = "fcc48c9812e6b5a0534f80b5bff9fddcc021280115434900da43870152f8f8f8"
runtime_expectation = "Kestra runtime with generated scripts and templates"

[platforms.kestra.ci.min]
python = "3.11"

[platforms.kestra.ci.primary]
python = "3.12"

[platforms.dbt]
required = true
extra = "dbt"
execution_target = "postgres"
core_range = "dbt-core>=1.11.14,<1.12.0"
execution_core_version = "1.11.16"
execution_adapter_version = "1.10.0"
coverage_threshold = 0.8

[dbt.compile_adapters]
postgres = "dbt-postgres>=1.10.0,<1.11.0"
snowflake = "dbt-snowflake>=1.10.0,<1.11.0"
bigquery = "dbt-bigquery>=1.10.0,<1.11.0"
redshift = "dbt-redshift>=1.11.1,<1.12.0"
databricks = "dbt-databricks>=1.10.0,<1.11.0"

[wheel_smoke]
extras = ["base", "airflow", "prefect", "dagster", "dbt", "opentelemetry"]

[security]
python = "primary"
blocking_surfaces = ["base", "airflow", "prefect", "dagster", "dbt", "kestra", "opentelemetry"]
advisory_surfaces = []
canary_surfaces = ["all"]

[security.surfaces.base]
extra = ""
host_requirements = ["truthound==3.0.0"]
constraints = []
constraint_urls = []

[security.surfaces.airflow]
extra = "airflow"
host_requirements = ["truthound==3.3.0", "apache-airflow==3.3.2"]
constraints = ["cryptography>=46.0.5", "certifi>=2026.10.19", "dnspython>=2.9.0", "opentelemetry-api>=1.45.1", "pyjwt>=2.15.0", "urllib3>=2.8.0"]
ignore_vulns = []
constraint_urls = []

[security.surfaces.prefect]
extra = "prefect"
host_requirements = ["truthound==3.3.0", "prefect==3.9.0"]
constraints = []
constraint_urls = []

[security.surfaces.dagster]
extra = "dagster"
host_requirements = ["truthound==3.3.0", "dagster==1.13.27", "dagster-webserver==1.13.27"]
constraints = []
constraint_urls = []

[security.surfaces.dbt]
extra = "dbt"
host_requirements = ["truthound==3.3.0", "dbt-core==1.11.16", "dbt-postgres==1.10.0"]
constraints = []
constraint_urls = []

[security.surfaces.kestra]
extra = "kestra"
host_requirements = ["truthound==3.3.0", "kestra==2.0.0"]
constraints = []
constraint_urls = []

[security.surfaces.opentelemetry]
extra = "opentelemetry"
host_requirements = [
    "truthound==3.3.0",
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
]
constraints = [
    "cryptography>=46.0.5",
    "googleapis-common-protos>=1.57,<2",
    "protobuf>=5.29.6,<6",
]
constraint_urls = []

[security.surfaces.all]
extra = "all"
host_requirements = ["truthound==3.0.0"]
constraints = []
constraint_urls = []

[advanced_tier]
engines = ["great_expectations", "pandera"]

[lanes.pr]
foundation_python = ["primary"]
shared_runtime_python = ["primary"]
airflow_versions = ["primary"]
prefect_versions = ["primary"]
dagster_versions = ["primary"]
mage_python = ["primary"]
kestra_versions = ["primary"]
dbt_compile_targets = ["postgres"]
dbt_execution = false

[lanes.main]
foundation_python = ["primary"]
shared_runtime_python = ["primary"]
airflow_versions = ["primary"]
prefect_versions = ["primary"]
dagster_versions = ["primary"]
mage_python = ["primary"]
kestra_versions = ["primary"]
dbt_compile_targets = ["postgres"]
dbt_execution = false

[lanes.release]
foundation_python = ["primary"]
shared_runtime_python = ["primary"]
airflow_versions = ["min", "primary"]
prefect_versions = ["min", "primary"]
dagster_versions = ["min", "primary"]
mage_python = ["primary"]
kestra_versions = ["min", "primary"]
dbt_compile_targets = ["postgres", "snowflake", "bigquery", "redshift", "databricks"]
dbt_execution = true

[lanes.nightly]
foundation_python = ["primary"]
shared_runtime_python = ["min", "primary", "canary"]
airflow_versions = ["primary"]
prefect_versions = ["primary"]
dagster_versions = ["primary"]
mage_python = ["primary"]
kestra_versions = ["primary"]
dbt_compile_targets = ["postgres", "snowflake", "bigquery", "redshift", "databricks"]
dbt_execution = true
