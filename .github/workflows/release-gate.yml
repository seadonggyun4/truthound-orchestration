name: Release Gate

on:
  workflow_dispatch:
    inputs:
      verification_runs:
        description: JSON map of workflow filenames to successful same-commit full release run IDs
        required: true
        type: string

permissions:
  contents: read
  actions: read
concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Write selected independent runs
        env:
          VERIFICATION_RUNS: ${{ inputs.verification_runs }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          Path('runs.json').write_text(os.environ['VERIFICATION_RUNS'])
          PY
      - id: verify
        name: Verify same-commit full release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci/release_evidence.py verify-runs --runs runs.json
      - uses: actions/download-artifact@v7
        with:
          name: truthound-orchestration-dist
          run-id: ${{ steps.verify.outputs.foundation_run_id }}
          github-token: ${{ github.token }}
          path: candidate
      - run: python scripts/ci/release_evidence.py verify-artifacts --dist-dir candidate/dist
      - uses: actions/upload-artifact@v6
        with:
          name: truthound-release-evidence
          path: release-evidence.json
