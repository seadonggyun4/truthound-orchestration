name: Kestra

on:
  workflow_call:
    inputs:
      lane:
        required: false
        type: string
        default: pr
      suite_tier:
        required: false
        type: string
        default: smoke
  workflow_dispatch:
    inputs:
      lane:
        description: CI lane to emulate
        required: true
        default: pr
        type: choice
        options:
          - pr
          - main
          - release
          - nightly
      suite_tier:
        description: Test breadth to execute
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full

concurrency:
  group: kestra-${{ github.event.pull_request.number || github.ref }}-${{ inputs.lane || github.event.inputs.lane || 'manual' }}-${{ inputs.suite_tier || github.event.inputs.suite_tier || 'smoke' }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      host_matrix: ${{ steps.export.outputs.host_matrix }}
      truthound_range: ${{ steps.export.outputs.truthound_range }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - id: export
        name: Export support matrix
        run: |
          python scripts/ci/export_support_matrix.py workflow \
            --workflow kestra \
            --lane "${{ inputs.lane || github.event.inputs.lane || 'pr' }}" \
            --github-output "$GITHUB_OUTPUT"

  kestra:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.host_matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            ci/support-matrix.toml
      - name: Install Kestra dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=84.1.0"
          python -m pip install -e ".[dev,kestra,opentelemetry]" "truthound==3.3.0" "kestra==${{ matrix.version }}" pip-audit
          mkdir -p artifacts/kestra
          python -m pip check
          python -m pip_audit --format json --output artifacts/kestra/audit.json
      - name: Run Kestra suites
        env:
          SUITE_TIER: ${{ inputs.suite_tier || github.event.inputs.suite_tier || 'smoke' }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/kestra
          if [ "${SUITE_TIER}" = "full" ]; then
            TESTS="packages/kestra/tests"
          else
            TESTS="
            packages/kestra/tests/test_scripts.py
            packages/kestra/tests/test_outputs.py
            packages/kestra/tests/test_depot.py
            "
          fi
          python -m pytest -q \
            ${TESTS} \
            --junitxml="artifacts/kestra/junit.xml" \
            --cov=common \
            --cov=packages/kestra/src/truthound_kestra \
            --cov-report="xml:artifacts/kestra/coverage.xml" | tee artifacts/kestra/pytest.log
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Download and verify pinned Kestra server
        run: |
          python - <<'PYCODE'
          import hashlib
          import tomllib
          import urllib.request
          from pathlib import Path
          data = tomllib.loads(Path("ci/support-matrix.toml").read_text())["platforms"]["kestra"]
          version = data["server_min"]
          jar = Path("${{ runner.temp }}") / "kestra-server"
          urllib.request.urlretrieve(
              f"https://github.com/kestra-io/kestra/releases/download/v{version}/kestra-{version}", jar
          )
          assert hashlib.sha256(jar.read_bytes()).hexdigest() == data["server_sha256"]
          PYCODE
      - name: Verify native Kestra execution and HTTP deny list
        run: |
          python scripts/ci/verify_kestra_server.py \
            --java "$JAVA_HOME/bin/java" \
            --server-jar "${{ runner.temp }}/kestra-server" \
            --output-dir artifacts/kestra/server
      - name: Upload Kestra artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: truthound-kestra-${{ matrix.label }}-${{ matrix.version }}-py${{ matrix.python_version }}
          path: |
            artifacts/kestra/*.xml
            artifacts/kestra/*.json
            artifacts/kestra/*.log
            artifacts/kestra/server/results.json

  summary:
    if: always()
    needs:
      - kestra
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Validate Kestra results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          needs = json.loads(os.environ["NEEDS_JSON"])
          failures = {
              name: details["result"]
              for name, details in needs.items()
              if details["result"] not in {"success", "skipped"}
          }
          if failures:
              raise SystemExit(f"Kestra CI failed: {failures}")
          print("Kestra summary passed")
          PY
